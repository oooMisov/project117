<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>{% block title %}Мой бюджет{% endblock %}</title>
    <script>
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="{{ url_for('index') }}">💰 <span>Мой бюджет</span></a>
        {% if current_user %}
        <nav class="nav">
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('goals') }}">🎯 Цели</a>
            <a class="nav-button" href="{{ url_for('add_transaction') }}">+ Операция</a>
            <form action="{{ url_for('logout') }}" method="post" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="nav-link">Выйти</button>
            </form>
            <button type="button" class="theme-toggle" id="theme-toggle">
    🌙 <span class="theme-text">Тёмная тема</span>
</button>
         

        </nav>
        {% endif %}
    </div>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
<script>
    const themeToggle = document.getElementById("theme-toggle");
    const html = document.documentElement;

    function updateThemeButton() {
        const isDark = html.getAttribute("data-theme") === "dark";

        if (isDark) {
            themeToggle.innerHTML = '☀️ <span class="theme-text">Светлая тема</span>';
        } else {
            themeToggle.innerHTML = '🌙 <span class="theme-text">Тёмная тема</span>';
        }
    }

    themeToggle.addEventListener("click", function () {
        const isDark = html.getAttribute("data-theme") === "dark";

        if (isDark) {
            html.removeAttribute("data-theme");
            localStorage.setItem("theme", "light");
        } else {
            html.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
        }

        updateThemeButton();
    });

    updateThemeButton();
</script>
</body>
</html>
