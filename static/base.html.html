<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <script>
        (() => {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <title>{% block title %}Мой бюджет{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="{{ url_for('index') }}">💰 <span>Мой бюджет</span></a>
        {% if current_user %}
        <nav class="nav">
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                <span class="theme-icon">🌙</span>
                <span class="theme-text">Тёмная тема</span>
            </button>
            <a href="{{ url_for('index') }}">Обзор</a>
            <a class="nav-button" href="{{ url_for('add_transaction') }}">+ Операция</a>
            <form action="{{ url_for('logout') }}" method="post" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="nav-link">Выйти</button>
            </form>
        </nav>
        {% endif %}
    </div>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-stack">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<script>
    const themeToggle = document.getElementById('theme-toggle');

    function updateThemeButton() {
        if (!themeToggle) return;

        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        themeToggle.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
        themeToggle.querySelector('.theme-text').textContent =
            isDark ? 'Светлая тема' : 'Тёмная тема';
        themeToggle.setAttribute(
            'aria-label',
            isDark ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'
        );
    }

    if (themeToggle) {
        updateThemeButton();

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }

            updateThemeButton();
        });
    }
</script>
</body>
</html>
